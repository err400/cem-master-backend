services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-${BACKEND_PORT:-8000}}:8000"
    environment:
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the cem-database PostgreSQL URL}"
      CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      CEM_MASTER_API_KEY: "${BACKEND_API_KEY:-}"
      DATA_DIR: /data
      LOG_DIR: /data/logs/cem-master-backend
      FRONTEND_DIR: /app/frontend
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ${MASTER_FRONTEND_CONTEXT:-../cem-master}:/app/frontend:ro
      - ${CEM_DATA_DIR_HOST:-../cem-backend/data}:/data:ro
      - ${CEM_DATA_DIR_HOST:-../cem-backend/data}/logs/cem-master-backend:/data/logs/cem-master-backend:rw
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    networks:
      - cem-network
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the cem-database PostgreSQL URL}"
      DATA_DIR: /data
      LOG_DIR: /data/logs/cem-master-backend
      INDEXER_POLL_SECONDS: ${INDEXER_POLL_SECONDS:-30}
    volumes:
      - ./app:/app/app:ro
      - ${CEM_DATA_DIR_HOST:-../cem-backend/data}:/data:ro
      - ${CEM_DATA_DIR_HOST:-../cem-backend/data}/logs/cem-master-backend:/data/logs/cem-master-backend:rw
    command:
      - python
      - -m
      - app.indexer
      - --data-dir
      - /data
      - --all
      - --watch
    healthcheck:
      disable: true
    networks:
      - cem-network
    restart: unless-stopped

networks:
  cem-network:
    external: true
    name: cem_master_network

