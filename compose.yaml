services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the cem-database PostgreSQL URL}"
      CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      CEM_MASTER_API_KEY: "${BACKEND_API_KEY:-}"
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/app
    networks:
      - cem-network
    restart: unless-stopped

networks:
  cem-network:
    external: true
    name: cem_master_network
