[pytest]
pythonpath = .

# app/config.py raises at import time unless DATABASE_URL is set to a PostgreSQL
# URL, and the models now use PostgreSQL-only types (JSONB), so the test suite
# needs a real PostgreSQL -- SQLite will not do.
#
# Point TEST_DATABASE_URL at a throwaway database before running:
#
#   ./scripts/dev-up.sh                       # starts cem-database on :5432
#   export TEST_DATABASE_URL=postgresql+psycopg://cem_user:change-me@localhost:5432/cem_master_test
#   pytest
#
# tests/conftest.py creates the database if it does not exist and drops its
# schema between runs.
