[alembic]
# Migration scripts live here.
script_location = migrations

# Prefix new revision filenames with a UTC timestamp so they sort chronologically
# and merge conflicts are obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# NOTE: sqlalchemy.url is deliberately NOT set here.
# migrations/env.py reads DATABASE_URL via app.config.get_settings(), so the
# migration tool and the application can never disagree about which database
# they are pointed at, and no credentials live in a committed file.

prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# (none configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
